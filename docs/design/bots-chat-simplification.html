sation.',save:'Save',advancedHint:'Compatibility information only. Reuses native DSH capabilities; this prototype does not execute or save settings.',model:'Models / tools',modelValue:'Inherit workspace and Bot settings',memory:'Memory / schedules / connectors',memoryValue:'Reuse existing entries and permissions',native:'Chat and running state',nativeValue:'Planned bridge to native workspace sessions',close:'Close',profileHint:'Names and avatars are local examples. Describe roles in chat.',members:'Members',deleteTitle:'Delete this demo conversation?',deleteHint:'Removes only fictional records in this HTML. No DSH or user data is changed.',deleted:'Local demo conversation deleted',empty:'No conversations yet. Create a Bot or group to explore.',sent:'Just now',unnamed:'New Bot',untitled:'New conversation',noMatch:'No matching members',guidePreview:'Describe its role in chat',selectMore:'Choose at least 2 members'}
};
let lang='zh',seq=2,current='group',reply=null,running=false,mentionIndex=0,mentionRange=null,toastTimer;
const $=s=>document.querySelector(s),t=k=>copy[lang][k],escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bots=[{id:'a',key:'assistant',avatar:'◈'},{id:'r',key:'researcher',avatar:'◇'}];
const chats=[{id:'group',members:['a','r'],kind:'group',messages:[{author:'you',key:'sampleUser'},{author:'a',key:'sampleAnswer'},{author:'r',key:'sampleResearch'}]},{id:'direct',members:['a'],kind:'private',messages:[{author:'a',key:'sampleAnswer'}]}];
const name=b=>b.name||t(b.key),bot=id=>bots.find(b=>b.id===id),chat=()=>chats.find(c=>c.id===current),title=c=>c.name||c.members.map(id=>name(bot(id))).join(' + '),msgText=m=>m.text||t(m.key),authorName=a=>a==='you'?t('you'):name(bot(a));
function toast(key){$('#toast').textContent=t(key);$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function localize(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('#language').textContent=lang==='zh'?'EN':'中文';$('#input').placeholder=t('placeholder');$('#search').placeholder=t('search');$('#timeline').setAttribute('aria-label',t('inputLabel'));render()}
function renderList(){const query=$('#search').value.trim().toLocaleLowerCase();const filtered=chats.filter(c=>(title(c)+' '+t(c.kind)).toLocaleLowerCase().includes(query));$('#conversations').innerHTML=filtered.map(c=>`<button class="conversation" data-chat="${c.id}" aria-selected="${c.id===current}"><span class="avatar">${c.kind==='group'?'◌':bot(c.members[0]).avatar}</span><span class="names">${escapeHTML(title(c))}<span class="preview">${escapeHTML(t(c.kind))} · ${escapeHTML(c.messages.length?msgText(c.messages.at(-1)):t('guidePreview'))}</span></span></button>`).join('')||`<p class="muted">${t('noChats')}</p>`;}
function render(){const c=chat();renderList();$('#title').textContent=c?title(c):t('untitled');$('#chatAvatar').textContent=c?(c.kind==='group'?'◌':bot(c.members[0]).avatar):'◌';$('#subtitle').textContent=c?`${t(c.kind)} · ${c.members.map(id=>name(bot(id))).join(' / ')}`:'';$('#timeline').innerHTML=c?`<p class="intro">${t(c.guide?'welcomeNote':'example')}</p>`+c.messages.map((m,i)=>`<article class="message"><span class="avatar">${m.author==='you'?'◯':bot(m.author).avatar}</span><div class="body"><strong>${escapeHTML(authorName(m.author))}</strong><time>${m.local?t('sent'):'10:24'}</time>${m.quote?`<blockquote>${escapeHTML(m.quote)}</blockquote>`:''}<p>${escapeHTML(msgText(m))}</p><button class="quiet replybtn" data-reply="${i}">${t('reply')}</button></div></article>`).join('')+(c.guide?`<p class="intro">${t(c.kind==='group'?'groupStart':'welcome')}</p>`:''):`<p class="empty">${t('empty')}</p>`;$('#status').textContent=t(running?'running':'idle');$('#input').disabled=!c;$('#send').disabled=!c;$('#more').disabled=!c;$('#quote').hidden=!reply;if(reply)$('#quote span').textContent=`${authorName(reply.author)}: ${msgText(reply)}`;$('#mentions').hidden=true;mentionRange=null;$('#menu').hidden=true;$('#more').setAttribute('aria-expanded','false')}
function openChat(id){current=id;reply=null;running=false;$('#input').value='';$('#shell').dataset.mobile='chat';render()}
$('#conversations').onclick=e=>{const b=e.target.closest('[data-chat]');if(b)openChat(b.dataset.chat)};
$('#timeline').onclick=e=>{const b=e.target.closest('[data-reply]');if(!b)return;reply=chat().messages[Number(b.dataset.reply)];render();$('#input').focus()};
$('#clearQuote').onclick=()=>{reply=null;render();$('#input').focus()};
$('#back').onclick=()=>$('#shell').dataset.mobile='list';
$('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';$('#dialog').close();localize()};
$('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
$('#toggleRun').onclick=()=>{running=!running;$('#status').textContent=t(running?'running':'idle')};
function send(){const text=$('#input').value.trim();if(!text||!chat())return;chat().messages.push({author:'you',text,local:true,quote:reply?`${authorName(reply.author)}: ${msgText(reply)}`:null});reply=null;$('#input').value='';render();$('#timeline').scrollTop=$('#timeline').scrollHeight;toast('localOnly');$('#input').focus()}
$('#send').onclick=send;
function candidates(){const c=chat();if(!c)return [];const members=c.members.map(bot);if(c.kind==='group')members.unshift({id:'everyone',key:'everyone',avatar:'◌'});return members.filter(b=>name(b).toLowerCase().includes((mentionRange?.query||'').toLowerCase()))}
function updateMention(){if(!chat()){mentionRange=null;$('#mentions').hidden=true;return}const input=$('#input'),at=input.selectionStart,match=input.value.slice(0,at).match(/(?:^|\s)@([^\s@]*)$/u);mentionRange=match?{start:at-match[1].length-1,end:at,query:match[1]}:null;mentionIndex=0;renderMention()}
function renderMention(){const box=$('#mentions');box.hidden=!mentionRange;if(!mentionRange)return;const list=candidates();box.innerHTML=list.length?list.map((b,i)=>`<button type="button" role="option" aria-selected="${i===mentionIndex}" data-mention="${i}"><span>${b.avatar}</span>${escapeHTML(name(b))}</button>`).join(''):`<small>${t('noMatch')}</small>`}
function chooseMention(i){const b=candidates()[i];if(!b||!mentionRange)return;const input=$('#input'),value=b.id==='everyone'?'@everyone ':'@'+name(b)+' ',start=mentionRange.start;input.value=input.value.slice(0,start)+value+input.value.slice(mentionRange.end);input.focus();input.setSelectionRange(start+value.length,start+value.length);mentionRange=null;$('#mentions').hidden=true}
$('#input').oninput=updateMention;$('#input').onclick=updateMention;
$('#input').onkeydown=e=>{if(e.isComposing)return;if(mentionRange){const n=candidates().length;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();mentionIndex=n?(mentionIndex+(e.key==='ArrowDown'?1:-1)+n)%n:0;renderMention();return}if((e.key==='Enter'||e.key==='Tab')&&n){e.preventDefault();chooseMention(mentionIndex);return}if(e.key==='Escape'){mentionRange=null;$('#mentions').hidden=true;return}}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#mentions').onmousedown=e=>{const b=e.target.closest('[data-mention]');if(b){e.preventDefault();chooseMention(Number(b.dataset.mention))}};
function dialog(titleKey,content,actionKey,action){const d=$('#dialog');$('#newMenu').hidden=true;$('#newEntry').setAttribute('aria-expanded','false');d.onchange=null;d.innerHTML=`<h2 id="dialogTitle">${t(titleKey)}</h2>${content}<div class="dialogfooter"><button id="dialogCancel">${t(actionKey?'cancel':'close')}</button>${actionKey?`<button class="primary" id="dialogAction">${t(actionKey)}</button>`:''}</div>`;$('#dialogCancel').onclick=()=>d.close();if(actionKey)$('#dialogAction').onclick=action;d.showModal()}
$('#search').oninput=renderList;
$('#newEntry').onclick=()=>{const menu=$('#newMenu');menu.hidden=!menu.hidden;$('#newEntry').setAttribute('aria-expanded',String(!menu.hidden))};
$('#createBot').onclick=()=>{let avatar='◈';dialog('createTitle',`<p class="muted">${t('botHint')}</p><div class="formrow"><button id="avatar" aria-label="${t('avatar')}">◈</button><label>${t('name')}<input id="botName" type="text" maxlength="48" autocomplete="off" required></label></div><small>${t('avatar')}</small>`,'create',()=>{const n=$('#botName').value.trim();if(!n){$('#botName').focus();return}const id='b'+(++seq);bots.push({id,name:n,avatar});chats.unshift({id,members:[id],kind:'private',messages:[],guide:true});$('#dialog').close();openChat(id)});$('#avatar').onclick=()=>{const options=['◈','◇','✧','◎'];avatar=options[(options.indexOf(avatar)+1)%options.length];$('#avatar').textContent=avatar};$('#botName').focus()};
$('#createGroup').onclick=()=>{dialog('groupTitle',`<p class="muted">${t('groupHint')}</p>${bots.map(b=>`<label class="member"><span class="avatar">${b.avatar}</span>${escapeHTML(name(b))}<input type="checkbox" value="${b.id}" class="pick"></label>`).join('')}<small id="memberHint">${t('selectMore')}</small>`,'create',()=>{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(ids.length<2)return;const id='g'+(++seq);chats.unshift({id,members:ids,kind:'group',messages:[],guide:true});$('#dialog').close();openChat(id)});$('#dialogAction').disabled=true;$('#dialog').onchange=()=>$('#dialogAction').disabled=document.querySelectorAll('.pick:checked').length<2};
$('#more').onclick=()=>{const menu=$('#menu');menu.hidden=!menu.hidden;$('#more').setAttribute('aria-expanded',String(!menu.hidden));menu.innerHTML=['rename','profile','advanced','remove'].map(k=>`<button role="menuitem" data-action="${k}">${t(k)}</button>`).join('')};
$('#menu').onclick=e=>{const action=e.target.dataset.action,c=chat();if(!action||!c)return;$('#menu').hidden=true;$('#more').setAttribute('aria-expanded','false');if(action==='rename'){dialog('rename',`<p class="muted">${t('renameHint')}</p><label>${t('name')}<input id="rename" type="text" maxlength="96" value="${escapeHTML(title(c))}"></label>`,'save',()=>{const v=$('#rename').value.trim();if(!v)return;c.name=v;$('#dialog').close();render()})}if(action==='profile')dialog('profile',`<p class="muted">${t('profileHint')}</p><b>${t('members')}</b>${c.members.map(id=>`<div class="member"><span class="avatar">${bot(id).avatar}</span>${escapeHTML(name(bot(id)))}</div>`).join('')}`);if(action==='advanced')dialog('advanced',`<p class="muted">${t('advancedHint')}</p>${[['model','modelValue'],['memory','memoryValue'],['native','nativeValue']].map(([k,v])=>`<div class="detail"><span>${t(k)}</span><span class="muted">${t(v)}</span></div>`).join('')}`);if(action==='remove')dialog('deleteTitle',`<p>${t('deleteHint')}</p>`,'remove',()=>{chats.splice(chats.indexOf(c),1);current=chats[0]?.id;reply=null;$('#input').value='';$('#dialog').close();render();toast('deleted')})};
document.addEventListener('click',e=>{if(!e.target.closest('.new-entry')){$('#newMenu').hidden=true;$('#newEntry').setAttribute('aria-expanded','false')}if(!e.target.closest('.end')){$('#menu').hidden=true;$('#more').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#newMenu').hidden=true;$('#newEntry').setAttribute('aria-expanded','false');$('#menu').hidden=true;$('#more').setAttribute('aria-expanded','false')}});
localize();
</script></body></html>
